<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07100d" />
    <title>DataLens · OEE 指标驾驶舱</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="DataLens">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M7 8c0-2 4-4 9-4s9 2 9 4-4 4-9 4-9-2-9-4Z"/><path d="M7 8v8c0 2 4 4 9 4s9-2 9-4V8M7 16v8c0 2 4 4 9 4s9-2 9-4v-8"/></svg>
          </span>
          <span><strong>DataLens</strong><small>OEE INTELLIGENCE</small></span>
        </div>
        <div class="dashboard-heading">
          <div class="heading-line"><span class="live-dot"></span><h1>Test OEE 综合看板</h1></div>
          <p><span id="dashboardDateRange">读取数据范围…</span><span class="heading-separator">/</span><span id="dashboardUpdatedAt">准备快照…</span></p>
        </div>
        <div class="topbar-actions">
          <button class="topbar-button" id="dashboardEditButton" type="button" aria-pressed="false" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.2-1 10.9-10.9a2.1 2.1 0 0 0-3-3L5.2 16 4 20ZM14.8 6.2l3 3"/></svg><span>编辑看板</span>
          </button>
          <button class="topbar-button primary" id="newChatButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新建会话
          </button>
          <button class="topbar-button" id="historyButton" type="button" aria-label="查看历史会话" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6M4 4v4.6h4.6M12 8v4l3 2"/></svg>历史
          </button>
        </div>
      </header>

      <main class="dashboard-main" id="dashboardMain">
        <section class="dashboard-grid" id="dashboardGrid" aria-label="指标看板" aria-live="polite">
          <article class="metric-card dashboard-loading"><span></span><p>正在构建会话看板…</p></article>
        </section>
      </main>
    </div>

    <section class="chat-dock" id="chatDock" aria-label="Agent 会话">
      <div class="chat-expanded">
        <header class="chat-header">
          <div>
            <span class="agent-status"><i></i>DATA AGENT</span>
            <h2 id="chatTitle">新会话</h2>
          </div>
          <div class="chat-header-actions">
            <button class="icon-button" id="chatCollapseButton" type="button" aria-label="收起会话">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
        </header>

        <div class="messages" id="messages" aria-live="polite">
          <section class="welcome" id="welcome">
            <span class="welcome-kicker">ASK YOUR DATA</span>
            <h3>从指标开始提问</h3>
            <p>Agent 会查询真实数据，并在适合时自动更新看板。</p>
            <div class="suggestions">
              <button type="button" data-question="比较过去 7 天 MT 和 ST 的 Yield，并更新看板。">比较 7 天 Yield</button>
              <button type="button" data-question="分析最近 14 天 Test OEE 的异常日期，并更新相关图表。">定位 OEE 异常</button>
              <button type="button" data-question="检查当前数据的覆盖范围和缺失日期。">检查数据覆盖</button>
            </div>
          </section>
        </div>
      </div>

      <form class="composer" id="composer">
        <div class="composer-status" id="composerStatus"><span>Agent 指标入口</span><small>点击展开会话</small></div>
        <textarea id="questionInput" rows="1" maxlength="4000" placeholder="询问任意口径的指标…" aria-label="输入指标问题"></textarea>
        <div class="composer-actions">
          <span class="composer-hint"><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd> + <kbd>Enter</kbd> 换行</span>
          <button class="send-button" id="sendButton" type="submit" aria-label="发送问题">
            <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Z"/><path d="m12 13 7-8"/></svg>
            <svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
          </button>
        </div>
      </form>
    </section>

    <aside class="history-panel" id="historyPanel" aria-label="历史会话">
      <div class="history-panel-header">
        <div><span>HISTORY</span><h2>历史会话</h2></div>
        <button class="icon-button" id="historyCloseButton" type="button" aria-label="关闭历史会话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <p class="history-panel-copy">每个会话保留独立的对话和看板快照。</p>
      <nav class="session-list" id="sessionList"><div class="session-placeholder">还没有会话</div></nav>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/vendor/marked.js"></script>
    <script src="/vendor/dompurify.js"></script>
    <script src="/vendor/echarts.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
